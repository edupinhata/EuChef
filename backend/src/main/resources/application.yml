spring:
  application:
    name: meal-planner
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: ${BACKEND_PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EUCHEFSESSION
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

euchef:
  security:
    allowed-origins: []
    max-request-size: 1MB
    rate-limit:
      api-requests: 120
      auth-requests: 10
      window: 1m
      max-clients: 10000
